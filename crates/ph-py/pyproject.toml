[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "planetary-harmonics"
description = "Analysis primitives for celestial-terrestrial harmonic feature analysis"
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
